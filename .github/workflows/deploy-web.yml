# Telegram Mini App (web build) → Cloudflare Pages.
#   push to stage → dev server  → https://ustara-dev.pages.dev  (dev bot)
#   push to main  → production → https://ustara.pages.dev      (production bot)
# Database migrations and Edge Functions are NOT deployed here; they stay a manual, approved step.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
#   DEV_SUPABASE_URL, DEV_SUPABASE_ANON_KEY
#   PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY
#   SENTRY_DSN               optional
name: Deploy Mini App

on:
  push:
    branches: [stage, main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'stage' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      PAGES_PROJECT: ${{ github.ref_name == 'main' && 'ustara' || 'ustara-dev' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ github.ref_name == 'main' && secrets.PROD_SUPABASE_URL || secrets.DEV_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref_name == 'main' && secrets.PROD_SUPABASE_ANON_KEY || secrets.DEV_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_REGION: ${{ github.ref_name == 'main' && 'eu-west-2' || 'ap-northeast-2' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests and type check
        run: |
          npm test
          npx tsc --noEmit -p apps/mobile

      - name: Build
        working-directory: apps/mobile
        run: node scripts/build-web.mjs "$TARGET"

      - name: Deploy to Cloudflare Pages
        working-directory: apps/mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy "dist-web-$TARGET" --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
